<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moment Foto</title>
</head>
<body>
    <style>
        body {
          font-family: 'Poppins', sans-serif;
          background: url(foto4.jpeg) no-repeat center center fixed;
          background-size: cover;
          margin: 0;
          padding-top: 80px;
          color: white;
        }
    
        nav {
          background: rgba(31, 33, 32, 0.7);
          padding: 15px 30px;
          position: fixed;
          width: 100%;
          top: 0;
          display: flex;
          justify-content: center;
          gap: 40px;
          z-index: 1000;
        }
    
        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
        }
    
        nav a:hover {
          color: #ffcc00;
        }
    
        .konten {
          max-width: 900px;
          margin: auto;
          background: rgba(0, 0, 0, 0.6);
          padding: 40px;
          border-radius: 12px;
          text-align: center;
        }
    
        .gallery {
          display: flex;
          flex-wrap: wrap;
          gap: 20px;
          justify-content: center;
          margin-top: 20px;
        }
    
        .gallery img {
          width: 250px;
          height: 180px;
          object-fit: cover;
          border-radius: 10px;
          box-shadow: 0 4px 10px rgba(0,0,0,0.5);
          transition: transform 0.3s;
        }
    
        .gallery img:hover {
          transform: scale(1.05);
        }
      </style>
      <!-- Navbar di bagian atas -->
      <nav>
        <a href="hal1.html">Home</a>
        <a href="hal2.html">Pintu Rimba</a>
        <a href="hal3.html">Moment Foto</a>
      </nav>
    </head>
    <body>
      <div class="konten">
        <h1>Moment-Moment keindahan alam bukit kaba</h1>
        <p>Ini lah cara saya mengurangi stres,dan menikmati keindahan alam belantara.</p>
    
        <div class="gallery">
          <img src="foto5.jpeg" alt="Foto 1">
          <img src="foto6.jpeg" alt="Foto 2">
          <img src="foto7.jpeg" alt="Foto 3">
          <img src="foto8.jpeg" alt="Foto 4">
          <img src="foto9.jpeg" alt="Foto 5">
        </div>
      </div>

</body>
</html>
